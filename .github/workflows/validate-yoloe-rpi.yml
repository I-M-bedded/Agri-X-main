name: validate-yoloe-rpi

on:
  push:
    branches: [feature/aruco-align-bringup]
    paths:
      - '.github/workflows/validate-yoloe-rpi.yml'
      - 'farm_robot/tools/validate_yoloe_zero_shot.py'
      - 'farm_robot/tools/export_yoloe_rpi.py'
      - 'farm_robot/sensors/ai_perception.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-yoloe-rpi.yml'
      - 'farm_robot/tools/validate_yoloe_zero_shot.py'
      - 'farm_robot/tools/export_yoloe_rpi.py'
      - 'farm_robot/sensors/ai_perception.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime/export dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'ultralytics[export]' opencv-python-headless

      - name: Download public bare-furrow validation images
        run: |
          mkdir -p farm_robot/test_images
          curl -L --fail --retry 3 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Furrows_J1.jpg?width=960' \
            -o farm_robot/test_images/furrows_j1.jpg
          curl -L --fail --retry 3 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ridges_and_furrows_-_geograph.org.uk_-_1267026.jpg' \
            -o farm_robot/test_images/ridges_furrows.jpg
          file farm_robot/test_images/*

      - name: Run prompted YOLOE-26n zero-shot segmentation
        working-directory: farm_robot
        run: |
          python tools/validate_yoloe_zero_shot.py \
            test_images/furrows_j1.jpg \
            test_images/ridges_furrows.jpg \
            --checkpoint yoloe-26n-seg.pt \
            --imgsz 320 \
            --conf 0.20 \
            --output artifacts/yoloe_zero_shot

      - name: Export prompted model to NCNN
        working-directory: farm_robot
        run: |
          python tools/export_yoloe_rpi.py \
            --checkpoint yoloe-26n-seg.pt \
            --imgsz 320 \
            --output models/agri_yoloe26n_ncnn_model
          find models/agri_yoloe26n_ncnn_model -maxdepth 2 -type f -printf '%p %k KB\n'

      - name: Smoke-test exported NCNN model
        working-directory: farm_robot
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          model = YOLO('models/agri_yoloe26n_ncnn_model')
          r = model.predict('test_images/furrows_j1.jpg', imgsz=320, conf=0.20, verbose=False)[0]
          print('NCNN boxes:', 0 if r.boxes is None else len(r.boxes))
          print('NCNN masks:', 0 if r.masks is None else len(r.masks.data))
          PY

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoloe-rpi-validation
          path: |
            farm_robot/artifacts/yoloe_zero_shot/
            farm_robot/models/agri_yoloe26n_ncnn_model/
          if-no-files-found: warn
          retention-days: 7
